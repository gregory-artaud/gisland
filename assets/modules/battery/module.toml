id = "battery"
name = "Battery"
description = "UPower battery status and power alerts"
command = ["gisland-lua-host"]
entry = "battery.lua"
config = "config.toml"
view = "view.toml"

[protocol]
major = 1
minimum_minor = 8
maximum_minor = 8

[options_schema.warning_percent]
type = "integer"
minimum = 1
maximum = 100

[options_schema.persistent_percent]
type = "integer"
minimum = 1
maximum = 100

[options_schema.critical_percent]
type = "integer"
minimum = 1
maximum = 100

[options_schema.yellow_percent]
type = "integer"
minimum = 1
maximum = 100

[options_schema.red_percent]
type = "integer"
minimum = 1
maximum = 100

[options_schema.preview_duration_ms]
type = "integer"
minimum = 0
maximum = 60000
