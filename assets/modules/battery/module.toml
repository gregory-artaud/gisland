id = "battery"
name = "Battery"
description = "UPower battery status and power alerts"
command = ["gisland-battery"]

[protocol]
major = 1
minimum_minor = 5
maximum_minor = 5

[defaults]
warning_percent = 20
persistent_percent = 10
critical_percent = 5
yellow_percent = 30
red_percent = 15
preview_duration_ms = 3000

[options_schema.warning_percent]
type = "integer"

[options_schema.persistent_percent]
type = "integer"

[options_schema.critical_percent]
type = "integer"

[options_schema.yellow_percent]
type = "integer"

[options_schema.red_percent]
type = "integer"

[options_schema.preview_duration_ms]
type = "integer"
