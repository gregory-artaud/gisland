id = "clock-calendar"
name = "Clock and Calendar"
description = "Localized live clock and monthly calendar"
command = ["gisland-lua-host"]
entry = "clock_calendar.lua"
config = "config.toml"
view = "view.toml"

[protocol]
major = 1
minimum_minor = 8
maximum_minor = 9

[options_schema.locale]
type = "string"

[options_schema.timezone]
type = "string"

[options_schema.week_start]
type = "string"
allowed = ["monday", "sunday"]
