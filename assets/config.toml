monitor = "primary"
theme = "default"
[defaults]
compact = "clock"
expanded = "clock"

[interaction]
animation_speed = 1.25
hover_exit_ms = 120
reduced_motion = false

[[modules]]
id = "clock"
module = "clock-calendar"
enabled = true
restart = "on-failure"

[modules.options]
week_start = "monday"

[[modules]]
id = "notifications"
module = "notifications"
enabled = true
restart = "on-failure"

[[modules]]
id = "battery"
module = "battery"
enabled = true
restart = "on-failure"

[[modules]]
id = "audio"
module = "audio"
enabled = true
restart = "on-failure"
protocol_min = "1.8"
protocol_max = "1.8"

[modules.options]
step_percent = 5
maximum_percent = 150
hud_duration_ms = 1500
